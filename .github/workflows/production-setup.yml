name: Production setup

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Что выполнить"
        required: true
        default: database
        type: choice
        options:
          - database
          - webhook
          - diagnostics

permissions:
  contents: read

concurrency:
  group: maksim-production-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply database migrations
        if: inputs.operation == 'database'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run db:deploy

      - name: Create initial settings
        if: inputs.operation == 'database'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run db:seed

      - name: Connect Telegram webhook
        if: inputs.operation == 'webhook'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: npm run telegram:webhook

      - name: Diagnose Telegram connection (read only)
        if: inputs.operation == 'diagnostics'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: npm run telegram:diagnostics
