services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: maksim
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: maksim
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maksim -d maksim']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
